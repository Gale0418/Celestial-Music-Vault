<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AeroMusic 預設封面</title>
  <desc id="desc">炭黑與珊瑚紅構成的編輯風抽象唱片封套</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#191b20"/>
      <stop offset="1" stop-color="#090a0c"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .14"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="512" height="512" rx="38" fill="url(#paper)"/>
  <path d="M0 0h184L0 322z" fill="#ff6257"/>
  <path d="M512 512H312l200-304z" fill="#f0ede5"/>
  <circle cx="270" cy="246" r="142" fill="#0b0c0f" stroke="#f0ede5" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="270" cy="246" r="112" fill="none" stroke="#f0ede5" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="270" cy="246" r="74" fill="#ff6257"/>
  <circle cx="270" cy="246" r="14" fill="#f0ede5"/>
  <path d="M58 438h124" stroke="#f0ede5" stroke-width="8"/>
  <path d="M58 460h72" stroke="#ff6257" stroke-width="8"/>
  <rect width="512" height="512" rx="38" filter="url(#grain)" opacity=".42"/>
  <rect x="1" y="1" width="510" height="510" rx="37" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
</svg>
