[package]
name = "cmv-core-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Platform-neutral core for Celestial Music Vault"
license = "Proprietary"
publish = false

[workspace]
members = ["ffi"]
resolver = "3"

[lib]
name = "cmv_core_rs"
path = "src/lib.rs"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
